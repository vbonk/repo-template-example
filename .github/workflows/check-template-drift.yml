# Template Drift Check — downstream caller
#
# This repo was built from vbonk/repo-template. The template publishes a
# reusable drift-detection workflow; this thin caller runs it weekly so we
# find out when the template ships changes worth pulling in.
# This is the downstream form of the workflow — the reusable implementation
# lives in the template repo.

name: Template Drift Check

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: vbonk/repo-template/.github/workflows/check-template-drift.yml@main
    with:
      template_repo: 'vbonk/repo-template'
      severity: 'warn'
